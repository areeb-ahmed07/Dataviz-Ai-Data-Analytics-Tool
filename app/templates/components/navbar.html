<!-- Top Navigation Bar -->
<header class="dash-topbar" id="dashTopbar">
    <div class="topbar-left">
        <button class="topbar-toggle" id="sidebarToggleBtn" aria-label="Toggle sidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
        </button>
        <div class="topbar-breadcrumb" id="topbarBreadcrumb">
            <span class="breadcrumb-item">Dashboard</span>
        </div>
    </div>

    <div class="topbar-center">
        <form class="topbar-search" action="{{ url_for('dashboard.search') }}" method="GET">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" name="q" class="search-input" placeholder="Search datasets..." value="{{ request.args.get('q', '') }}">
        </form>
    </div>

    <div class="topbar-right">
        <button type="button" class="topbar-icon-btn theme-toggle theme-switch" id="themeToggle"
                role="switch" aria-checked="false" aria-label="Dark mode"
                title="Switch to dark mode" data-url="{{ url_for('dashboard.update_theme') }}">
            <span class="theme-switch-thumb" aria-hidden="true"></span>
            <svg class="theme-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
            <svg class="theme-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M21 13A9 9 0 0 1 11 3a9 9 0 1 0 10 10Z"/></svg>
        </button>
        <span id="themeStatus" class="sr-only" role="status"></span>
        <!-- Help -->
        <a class="topbar-icon-btn" href="{{ url_for('dashboard.help_page') }}" aria-label="Help" title="Help">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        </a>

        <!-- Notifications -->
        <a class="topbar-icon-btn" href="{{ url_for('dashboard.notifications') }}" aria-label="Notifications" title="Notifications">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        </a>

        <!-- User Menu -->
        {% include "components/user_menu.html" %}
    </div>
</header>
