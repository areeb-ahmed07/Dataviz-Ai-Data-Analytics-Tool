<div class="report-actions" role="group" aria-label="Actions for {{ report_filename }}">
    <a class="report-action" href="{{ url_for('reports.report_file', filename=report_filename) }}" target="_blank" rel="noopener" title="View report" aria-label="View {{ report_filename }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
    </a>
    <a class="report-action" href="{{ url_for('reports.report_file', filename=report_filename, download=1) }}" title="Download report" aria-label="Download {{ report_filename }}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>
    </a>
    <form method="post" action="{{ url_for('reports.delete_report', filename=report_filename) }}" class="report-delete-form" data-filename="{{ report_filename }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="return_to" value="{{ report_return_to | default('reports') }}">
        <button type="submit" class="report-action report-action-delete" title="Delete report" aria-label="Delete {{ report_filename }}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg>
        </button>
    </form>
</div>
