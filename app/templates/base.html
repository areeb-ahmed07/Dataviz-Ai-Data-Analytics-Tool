<!DOCTYPE html>
<html lang="en" data-theme-preference="{{ theme_preference | default('light') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DataViz Pro — AI-Powered Data Analytics Platform">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="theme-color" content="#0f766e">
    <script src="{{ url_for('static', filename='js/theme.js', v='4') }}"></script>
    <script defer src="{{ url_for('static', filename='js/theme-toggle.js', v='5') }}"></script>
    <title>{% block title %}DataViz Pro{% endblock %}</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Base Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css', v='20260915-mobile1') }}">

    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css', v='theme-switch-9') }}">
</head>
<body>
    {% block body %}
    {% endblock %}

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Base JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
